<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOCTURNE — Night Archive · Grail Auctions &amp; Afterlife Customs</title>
    <meta
      name="description"
      content="NOCTURNE — an after-dark archive of authenticated streetwear: live grail auctions with anti-snipe protection, Taste Codex mystery vaults and 1-of-1 Afterlife customs."
    />
    <meta name="theme-color" content="#0b0908" />
    <link rel="icon" type="image/svg+xml" href="/nocturne-mark.svg" />
    <meta property="og:site_name" content="NOCTURNE" />
    <meta property="og:title" content="NOCTURNE — Night Archive" />
    <meta property="og:description" content="Authenticated grails, nocturnal auctions and Afterlife customs." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-nocturne.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Hero LCP painting: discovered before the JS bundle, art-directed like <HeroPoster> -->
    <link rel="preload" as="image" type="image/avif" media="(max-aspect-ratio: 4/5)" imagesrcset="/images/nocturne/hero-sky-mobile-540.avif 540w, /images/nocturne/hero-sky-mobile-810.avif 810w, /images/nocturne/hero-sky-mobile-1080.avif 1080w" imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" media="(min-aspect-ratio: 4.001/5)" imagesrcset="/images/nocturne/hero-sky-desktop-960.avif 960w, /images/nocturne/hero-sky-desktop-1440.avif 1440w, /images/nocturne/hero-sky-desktop-1920.avif 1920w" imagesizes="100vw" fetchpriority="high" />
    <!-- First-visit boot veil: painted before the JS bundle; NocturneLoader takes over seamlessly. -->
    <script>
      try {
        if (navigator.webdriver || sessionStorage.getItem('nocturne_loader_seen') === '1' ||
            matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-boot')
      } catch (e) { document.documentElement.classList.add('no-boot') }
    </script>
    <style>
      #boot{position:fixed;inset:0;z-index:119;background:#0b0908;overflow:hidden;pointer-events:none}
      #boot picture img{width:100%;height:100%;object-fit:cover;transform:scale(1.25);filter:blur(3px) brightness(.55)}
      #boot .s{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 82%,rgba(200,134,74,.32),rgba(200,134,74,0) 70%),radial-gradient(ellipse 90% 70% at 50% 40%,rgba(11,9,8,.2),rgba(11,9,8,.75) 80%)}
      #boot .w{position:absolute;left:50%;top:50%;height:28px;transform:translate(-50%,-80%)}
      @media (min-width:768px){#boot .w{height:40px}}
      .no-boot #boot{display:none}
    </style>
  </head>
  <body class="bg-ink text-bone antialiased selection:bg-bone selection:text-ink">
    <div id="boot" aria-hidden="true">
      <picture>
        <source media="(max-aspect-ratio: 4/5)" type="image/avif" srcset="/images/nocturne/hero-sky-mobile-540.avif 540w, /images/nocturne/hero-sky-mobile-810.avif 810w, /images/nocturne/hero-sky-mobile-1080.avif 1080w" sizes="100vw" />
        <source media="(max-aspect-ratio: 4/5)" type="image/webp" srcset="/images/nocturne/hero-sky-mobile-540.webp 540w, /images/nocturne/hero-sky-mobile-810.webp 810w, /images/nocturne/hero-sky-mobile-1080.webp 1080w" sizes="100vw" />
        <source type="image/avif" srcset="/images/nocturne/hero-sky-desktop-960.avif 960w, /images/nocturne/hero-sky-desktop-1440.avif 1440w, /images/nocturne/hero-sky-desktop-1920.avif 1920w" sizes="100vw" />
        <img src="/images/nocturne/hero-sky-desktop-1440.webp" alt="" width="1920" height="1080" fetchpriority="high" />
      </picture>
      <div class="s"></div>
      <img class="w" src="/nocturne-wordmark.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
